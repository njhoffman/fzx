name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck bats just zsh jq fd-find ripgrep gawk procps psmisc git curl python3
          # Debian ships fd as fdfind; the files module handles both, the tests look for fd
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
          git config --global user.name ci && git config --global user.email ci@example.com
      - name: Lint
        run: just lint
      - name: Test
        run: bats test
